[package]
name = "qa-snapshot"
version = "0.1.0"
description = "Cross-device stealth screenshot Q&A"
authors = ["you"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "qa_snapshot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
qa-protocol = { path = "../crates/protocol" }

tauri = { version = "2.1", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-shell = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-opener = "2.0"
tauri-plugin-global-shortcut = "2.0"

# Async / cloud HTTP + WS
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }

reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
bytes = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
log = "0.4"
env_logger = "0.11"

# Errors
anyhow = "1"

# Base64 / image
base64 = "0.22"
async-stream = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# OS-specific
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSNotification", "NSString", "NSDictionary", "NSObject"] }
objc2-app-kit = { version = "0.2", features = ["NSApplication", "NSResponder", "NSWindow", "NSRunningApplication", "NSWorkspace"] }
core-graphics = "0.24"
core-foundation = "0.10"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
